[project]
name = "s1-incident-intake"
version = "0.1.0"
description = "Incident Intake & Triage - SDMA/SEOC"
requires-python = ">=3.11"

[tool.poetry.dependencies]
fastapi = "^0.110"
uvicorn = {version = "^0.29", extras = ["standard"]}
pydantic = "^2.6"
sqlalchemy = "^2.0"
asyncpg = "^0.29"
geoalchemy2 = "^0.14"
alembic = "^1.13"
aiokafka = "^0.10"
redis = {version = "^5.0", extras = ["hiredis"]}
httpx = "^0.27"
python-jose = {version = "^3.3", extras = ["cryptography"]}
passlib = {version = "^1.7", extras = ["bcrypt"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
