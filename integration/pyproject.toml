[project]
name = "scc-integration"
version = "0.1.0"
description = "Integration connectors for IMD, ERSS/112, CWC, INCOIS, RailMadad, SACHET"
requires-python = ">=3.11"

dependencies = [
    "aiokafka>=0.9.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "redis[hiredis]>=5.0.0",
    "lxml>=5.2.0",           # CAP/XML parsing for IMD/SACHET
    "feedparser>=6.0.0",     # RSS for INCOIS
    "tabula-py>=2.9.0",      # CWC PDF parsing
    "openpyxl>=3.1.0",       # CWC Excel parsing
    "tenacity>=8.3.0",
    "celery[redis]>=5.4.0",
    "click>=8.1.0",
]
