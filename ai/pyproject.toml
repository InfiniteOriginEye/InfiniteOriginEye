[project]
name = "scc-ai"
version = "0.1.0"
description = "Swarm Command & Control — AI/ML Training & Serving"
requires-python = ">=3.11"

dependencies = [
    # ── Training ──────────────────────────────────────
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "torchaudio>=2.3.0",
    "ultralytics>=8.2.0",
    "transformers>=4.42.0",
    "openai-whisper>=20231117",

    # ── Computer Vision ───────────────────────────────
    "opencv-python>=4.10.0",
    "albumentations>=1.4.0",
    "supervision>=0.21.0",

    # ── Structured ML ─────────────────────────────────
    "xgboost>=2.1.0",
    "lightgbm>=4.4.0",
    "scikit-learn>=1.5.0",

    # ── Data & Viz ────────────────────────────────────
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.22.0",

    # ── Experiment Tracking ───────────────────────────
    "mlflow>=2.14.0",
    "dagshub>=0.3.0",

    # ── Serving ───────────────────────────────────────
    "tritonclient[all]>=2.45.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxruntime-gpu>=1.18.0",

    # ── Utilities ─────────────────────────────────────
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "jupyter>=1.0.0",
    "ipywidgets>=8.1.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]
