[project]
name = "scc-drone-sim"
version = "0.1.0"
description = "Drone telemetry simulator for SC&C development & testing"
requires-python = ">=3.11"

dependencies = [
    "paho-mqtt>=2.1.0",
    "aiokafka>=0.9.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "faker>=26.0.0",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "geopy>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
