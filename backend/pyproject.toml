[project]
name = "scc-backend"
version = "0.1.0"
description = "Swarm Command & Control — Backend API & Services"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # ── Web Framework ─────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── Database ──────────────────────────────────────
    "sqlalchemy>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.14.0",

    # ── Event Streaming ───────────────────────────────
    "aiokafka>=0.9.0",
    "confluent-kafka>=2.5.0",

    # ── Cache / Real-time ─────────────────────────────
    "redis[hiredis]>=5.0.0",

    # ── AI/ML Inference Client ────────────────────────
    "tritonclient[all]>=2.45.0",
    "httpx>=0.27.0",

    # ── Geospatial ────────────────────────────────────
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "geojson>=3.1.0",

    # ── Auth & Security ───────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.7.0",

    # ── Integration Clients ───────────────────────────
    "aiohttp>=3.9.0",
    "websockets>=12.0",

    # ── Utilities ─────────────────────────────────────
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "orjson>=3.10.0",
    "celery[redis]>=5.4.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "faker>=26.0.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
