global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "scc-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "scc-telemetry"
    static_configs:
      - targets: ["host.docker.internal:9090"]

  - job_name: "triton"
    static_configs:
      - targets: ["triton:8002"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9092"]
