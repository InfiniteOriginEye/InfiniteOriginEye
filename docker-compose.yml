# ───────────────────────────────────────────────────────────────
# Swarm Command & Control — Local Development Stack
# ───────────────────────────────────────────────────────────────
# Run:  docker compose up -d
# Stop: docker compose down
# ───────────────────────────────────────────────────────────────

version: "3.9"

x-common-env: &common-env
  KAFKA_BROKERS: kafka:9092
  REDIS_URL: redis://redis:6379/0
  POSTGRES_DSN: postgresql+asyncpg://scc:scc@postgres:5432/scc
  MQTT_BROKER: mqtt://emqx:1883
  TRITON_URL: http://triton:8000

services:
  # ── Data Stores ──────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: scc
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # ── Event Streaming ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      zookeeper:
        condition: service_started
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    ports: ["2181:2181"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  # ── MQTT Broker (drone telemetry) ───────────────────────────
  emqx:
    image: emqx/emqx:5.7
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # WebSocket
      - "18083:18083"  # Dashboard
    volumes:
      - emqxdata:/opt/emqx/data

  # ── AI Model Serving ────────────────────────────────────────
  triton:
    image: nvcr.io/nvidia/tritonserver:24.06-py3
    ports:
      - "8000:8000"    # HTTP
      - "8001:8001"    # gRPC
      - "8002:8002"    # Metrics
    volumes:
      - ./ai/serving/triton/model_repository:/models
    command: ["tritonserver", "--model-repository=/models"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── MLflow Tracking ─────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    ports: ["5000:5000"]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://scc:scc@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflowdata:/mlflow/artifacts
    depends_on: [postgres]

  # ── Object Storage ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: sccminio
      MINIO_ROOT_PASSWORD: sccminio123
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  # ── Monitoring ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3002:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  emqxdata:
  mlflowdata:
  miniodata:
  grafanadata:
